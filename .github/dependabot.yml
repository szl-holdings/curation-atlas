version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 drops the JavaScript compiler API. typescript-eslint
      # (loaded by eslint-config-next) supports only typescript <6.1 and
      # throws "typescript-eslint does not support TS 7.0" on load, which
      # breaks `npm run lint`. Remove this once typescript-eslint's peer
      # range admits TypeScript 7 (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
