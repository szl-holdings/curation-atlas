name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  backend:
    name: Python API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install hash-locked Python closure
        working-directory: backend
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Build Space container
        working-directory: backend
        run: docker build --pull=false -t curation-atlas-ci .
      - name: Verify container serves the headless root contract
        run: |
          docker run --rm curation-atlas-ci python -c '
          from fastapi.testclient import TestClient
          import app
          assert app.app.title == "Curation Atlas API"
          with TestClient(app.app) as client:
              root = client.get("/")
              assert root.status_code == 200, root.text
              body = root.json()
              assert body["role"] == "HEADLESS_API"
              assert body["upstreamReadiness"] == "UNKNOWN"
              assert body["sourceRevision"] is None
              assert body["sourceBinding"] == "UNKNOWN"
              assert {item["path"] for item in body["entrypoints"]} == {
                  "/healthz", "/v1/orgs/szl-holdings/audit"
              }
              assert "mode" not in body and "publicOnly" not in body
              health = client.get("/healthz")
              assert health.status_code == 200
              assert health.json()["status"] == "PROCESS_ALIVE"
              assert health.json()["upstreamReadiness"] == "UNKNOWN"
              assert client.get("/not-an-entrypoint").status_code == 404
          '
